<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paytrellis demo</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="data:,">
</head>
<body>
  <header class="topbar"><div class="brand">Paytrellis <small>a fictional payments company</small></div></header>
  <main class="page">
    <p class="muted">The full ops queue arrives in the next pull request. For now, pick a request to call about:</p>
    <ul id="list"></ul>
  </main>
  <script type="module">
    const requests = await (await fetch("/api/requests")).json();
    document.getElementById("list").innerHTML = requests
      .map((r) => {
        const open = r.status === "needs_info" || r.status === "in_call";
        const label = `${r.id} · ${r.customer.name} → ${r.vendor.name} (${r.status})`;
        return `<li>${open ? `<a href="/call.html?request=${r.id}">${label}</a>` : label}</li>`;
      })
      .join("");
  </script>
</body>
</html>
