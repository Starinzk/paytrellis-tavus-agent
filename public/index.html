<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paytrellis · Ops queue</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="data:,">
</head>
<body>
  <header class="topbar">
    <div class="brand">Paytrellis <small>a fictional payments company</small></div>
    <nav><button class="btn small secondary" id="reset">Reset demo data</button></nav>
  </header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1>Payment requests on hold</h1>
        <div class="muted" id="counts"></div>
      </div>
      <div class="muted">Updates every few seconds</div>
    </div>

    <div class="error-box" id="error" hidden></div>

    <div class="card">
      <table class="queue">
        <thead>
          <tr><th>Request</th><th>Customer</th><th>Amount</th><th>Status</th><th>Problems and changes</th><th>Actions</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script type="module" src="/js/queue-page.js"></script>
</body>
</html>
